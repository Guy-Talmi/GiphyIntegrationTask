name: Deploy Client

on:
  push:
    branches:
      - master
    paths:
      - 'GiphyIntegration.client/**'
      - '.github/workflows/deploy-client.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-giphy-client
  cancel-in-progress: false

jobs:
  build-test-deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: GiphyIntegration.client

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: GiphyIntegration.client/package-lock.json

      - name: Set up npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Run client tests
        run: npm test -- --watch=false

      - name: Build production client
        run: npm run build -- --configuration production

      - name: Verify deployment files
        run: |
          test -f dist/giphy-integration-client/browser/index.html
          test -f dist/giphy-integration-client/browser/staticwebapp.config.json

      - name: Deploy client
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          production_branch: master
          app_location: GiphyIntegration.client/dist/giphy-integration-client/browser
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true