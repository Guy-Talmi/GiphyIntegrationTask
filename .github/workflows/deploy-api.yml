name: Deploy API

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-giphy-api
  cancel-in-progress: false

jobs:
  build-test-deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore GiphyIntegration.api.Tests/GiphyIntegration.api.Tests.csproj

      - name: Build API and tests
        run: >
          dotnet build GiphyIntegration.api.Tests/GiphyIntegration.api.Tests.csproj
          --configuration Release
          --no-restore

      - name: Run backend tests
        run: >
          dotnet test GiphyIntegration.api.Tests/GiphyIntegration.api.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "console;verbosity=normal"

      - name: Prepare deployment files
        run: >
          dotnet publish GiphyIntegration.api/GiphyIntegration.api.csproj
          --configuration Release
          --no-build
          --no-restore
          --output "${{ runner.temp }}/api-publish"

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: giphy-Integration-api
          package: ${{ runner.temp }}/api-publish